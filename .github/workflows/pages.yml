name: Verificar e publicar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm run audit && npm test
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Usar o build do aplicativo como origem do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type, html_url}'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar o site publicado
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pages.mjs
